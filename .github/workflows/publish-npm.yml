# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/droidrun/mobilerun-sdk-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.' or 'packages/mcp-server'
        required: true
        type: choice
        options:
          - '.'
          - 'packages/mcp-server'
      release_tag:
        description: Optional GitHub release tag for a manual MCP asset upload
        required: false
        type: string

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: |
          pnpm install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="$(jq -nc --arg path "$INPUT_PATH" '[$path]')"
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          DATA="$(jq -nc --arg paths "$PATHS_RELEASED" '{ paths_released: $paths }')" \
            pnpm tsn scripts/publish-packages.ts
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          NPM_TOKEN: ${{ secrets.MOBILERUN_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Upload MCP Server DXT GitHub release asset
        if: ${{ always() }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag supplied; skipping MCP release asset upload"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" \
            packages/mcp-server/mobilerun_sdk_api.mcpb \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
